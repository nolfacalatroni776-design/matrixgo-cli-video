<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>复制安装指令 · MatrixGo CLI</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f8f6;color:#252623;font:16px/1.6 system-ui,sans-serif}main{margin:clamp(36px,12vh,112px) auto;padding:0 22px;max-width:600px}img{width:130px;mix-blend-mode:multiply}h1{font-size:clamp(27px,5vw,37px);letter-spacing:-.04em;line-height:1.2;margin:36px 0 10px}p{color:#51544e}textarea{display:block;width:100%;font:inherit;color:inherit;background:transparent;border:1px solid #a4a69f;border-radius:8px;padding:15px;resize:none;margin:20px 0 14px}button{font:600 16px system-ui;color:white;background:#252623;border:0;padding:12px 22px;border-radius:6px;cursor:pointer}a{color:#575954;margin-left:17px}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #c7452c;outline-offset:3px}</style><main><img src="../logo.png" alt="MatrixGo by appen"><h1>安装 MatrixGo CLI</h1><p>复制下面这句话，发给 Codex、豆包工作或 WorkBuddy。</p><textarea rows="3" readonly aria-label="安装指令" id="prompt">请阅读：https://ui.appen.com.cn/agent-setup 并按照说明为我安装 MatrixGo CLI</textarea><button id="copy" type="button">复制安装指令</button><a href="https://ui.appen.com.cn/agent-cli-guide">使用说明 ↗</a><p id="status" role="status" aria-live="polite"></p></main><script>const t=document.getElementById('prompt'),b=document.getElementById('copy'),s=document.getElementById('status');b.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch{t.focus();t.select();try{ok=document.execCommand('copy')}catch{}}b.textContent=ok?'已复制':'复制安装指令';s.textContent=ok?'可以粘贴到你的 AI 助手了。':'已选中指令，请使用系统的复制功能。'}</script></html>
